name = "echo-edge-worker"
main = "src/index.ts"
compatibility_date = "2024-03-20"

[vars]
AXIM_LLM_PROXY_URL = "https://api.axim.us.com/v1/proxy/llm"
DLQ_TABLE_NAME = "echo_dlq_records"
AXIM_ALERT_WEBHOOK_URL = ""
AXIM_INTERNAL_KEY = "your-secret-key"
SUPABASE_URL = "https://your-supabase-url.supabase.co"
SUPABASE_ANON_KEY = "your-supabase-anon-key"

[triggers]
crons = ["0 0 * * *"]

[[kv_namespaces]]
binding = "ECHO_STATE_KV"
id = "ECHO_STATE_KV_ID"
